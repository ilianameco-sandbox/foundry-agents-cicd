# Promote an agent version built in the Foundry portal (dev project) into the repo, as a pull request.
# Actions -> promote-portal-agent -> Run workflow -> enter the version number (or "latest").
# Nothing is deployed here: merging the PR runs the dev gates, and prod still needs a release tag + approval.
name: promote-portal-agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent version in the dev project to promote (number, or "latest")
        required: true
        default: latest
      agent_name:
        description: Agent name in the dev project (leave empty for the pipeline's agent)
        required: false
        default: ""

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: promote-portal-agent
  cancel-in-progress: false

env:
  AGENT_DIR: agents/shift-manager

jobs:
  promote:
    name: Export portal version to a pull request
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
    defaults:
      run:
        working-directory: cicd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cicd/requirements.txt
      - run: pip install -r requirements.txt
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Export the portal version into agent.json and instructions.md
        id: promote
        env:
          VERSION: ${{ inputs.version }}
          AGENT_NAME: ${{ inputs.agent_name }}
        run: |
          args=(--agent-dir "$AGENT_DIR" --env dev --version "$VERSION" --pr-body out/promote-pr.md)
          [ -n "$AGENT_NAME" ] && args+=(--agent-name "$AGENT_NAME")
          python -m agent_cicd.promote "${args[@]}"

      - name: Check the exported files still pass Gate 1a
        if: steps.promote.outputs.changed == 'true'
        run: |
          pip install pytest==8.4.2
          python -m pytest tests -q
          python -m agent_cicd.deploy --agent-dir "$AGENT_DIR" --env prod --dry-run > /dev/null

      - name: Open a pull request
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ steps.promote.outputs.source_version }}
        run: |
          branch="promote/v${SOURCE_VERSION}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$AGENT_DIR/agent.json" "$AGENT_DIR/instructions.md"
          git commit -m "Promote portal agent version ${SOURCE_VERSION} (requested by ${GITHUB_ACTOR})"
          git push origin "$branch"
          if url=$(gh pr create --base main --head "$branch" \
                --title "Promote portal agent version ${SOURCE_VERSION}" --body-file out/promote-pr.md); then
            echo "Pull request: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "Could not open the pull request automatically (enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*)." >> "$GITHUB_STEP_SUMMARY"
            echo "Open it yourself: $compare" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing to promote
        if: steps.promote.outputs.changed != 'true'
        run: echo "Version ${{ steps.promote.outputs.source_version }} already matches the repo; no pull request." >> "$GITHUB_STEP_SUMMARY"
