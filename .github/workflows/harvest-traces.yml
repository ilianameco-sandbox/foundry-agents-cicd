# Trace harvest: real conversations -> candidate test cases -> pull request for human review.
# Candidates are appended to eval/dataset.jsonl with "needs_review": true; Gate 1a rejects that flag,
# so nothing reaches the quality gate until a reviewer accepts (removes the flag) or deletes each case.
# The weekly schedule is paused while v1 focuses on the release gates; run it by hand when needed.
name: harvest-traces

on:
  # schedule:
  #   - cron: "0 11 * * 1"   # Mondays 11:00 UTC (07:00 Toronto)
  workflow_dispatch:
    inputs:
      days:
        description: Days of conversations to scan
        default: "7"
      max_candidates:
        description: Maximum new cases per run
        default: "15"

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: harvest-traces
  cancel-in-progress: false

env:
  AGENT_DIR: agents/shift-manager

jobs:
  harvest:
    name: Harvest conversations into candidate test cases
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
    defaults:
      run:
        working-directory: cicd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cicd/requirements.txt
      - run: pip install -r requirements.txt
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Harvest App Insights traces and draft cases
        id: harvest
        run: >-
          python -m agent_cicd.harvest --agent-dir "$AGENT_DIR" --env dev
          --days "${{ inputs.days || '7' }}" --max-candidates "${{ inputs.max_candidates || '15' }}"
          --pr-body out/harvest-pr.md

      - name: Open a pull request for review
        if: steps.harvest.outputs.candidates != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="harvest/$(date -u +%Y%m%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$AGENT_DIR/eval/dataset.jsonl"
          git commit -m "Harvest ${{ steps.harvest.outputs.candidates }} candidate test case(s) from conversations"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Review ${{ steps.harvest.outputs.candidates }} candidate test case(s) from real conversations" \
            --body-file out/harvest-pr.md
